<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>WebFlix</title>
    <style>
      /*
       * WebFlix panel — the WebFlix 2.0 interface (YouTube-clone baseline) rendered inside the
       * ZCode workspace surface. Theme tokens are ported verbatim from WebFlix 2.0's
       * src/app/globals.css (dark default, light toggle). Layout values mirror the Tailwind
       * classes of the source components (h-14 topbar, w-60 sidebar, aspect-video cards …).
       */
      :root {
        color-scheme: light dark;
        --radius: 0.75rem;
        --background: #ffffff;
        --foreground: #0f0f0f;
        --secondary: #f2f2f2;
        --secondary-foreground: #0f0f0f;
        --muted: #f2f2f2;
        --muted-foreground: #606060;
        --accent: #e5e5e5;
        --accent-foreground: #0f0f0f;
        --border: #e5e5e5;
        --input: #e5e5e5;
        --ring: #ff0000;
        --yt-red: #ff0000;
        --yt-badge: rgba(0, 0, 0, 0.8);
        --hover: rgba(0, 0, 0, 0.05);
        --badge-bg: rgba(0, 0, 0, 0.8);
      }
      .dark {
        --background: #0f0f0f;
        --foreground: #f1f1f1;
        --secondary: #272727;
        --secondary-foreground: #f1f1f1;
        --muted: #272727;
        --muted-foreground: #aaaaaa;
        --accent: #3f3f3f;
        --accent-foreground: #f1f1f1;
        --border: #303030;
        --input: #303030;
        --ring: #ff0000;
        --yt-red: #ff0000;
        --yt-badge: rgba(0, 0, 0, 0.8);
        --hover: rgba(255, 255, 255, 0.1);
        --badge-bg: rgba(0, 0, 0, 0.8);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        font-size: 14px;
        line-height: 1.45;
        background: var(--background);
        color: var(--foreground);
        -webkit-font-smoothing: antialiased;
      }
      a { color: inherit; text-decoration: none; }
      button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
      img { display: block; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: var(--secondary); border-radius: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }

      /* ---------- app shell ---------- */
      .wf-root { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
      .wf-body { display: flex; flex: 1; min-height: 0; }
      .wf-main { flex: 1; min-width: 0; overflow-y: auto; }
      .wf-main-col { display: flex; flex-direction: column; min-height: 100%; }
      .wf-content { flex: 1; }

      /* ---------- topbar (h-14 = 56px) ---------- */
      .wf-topbar {
        position: sticky; top: 0; z-index: 40;
        display: flex; align-items: center; gap: 8px;
        height: 56px; padding: 0 8px;
        background: var(--background); flex-shrink: 0;
      }
      @media (min-width: 640px) { .wf-topbar { padding: 0 16px; } }
      .wf-topbar-left { display: flex; align-items: center; gap: 4px; }
      .wf-logo { display: flex; align-items: center; gap: 4px; padding: 0 4px; user-select: none; cursor: pointer; }
      .wf-logo-word { font-size: 18px; font-weight: 700; letter-spacing: -0.025em; }
      .wf-iconbtn {
        display: inline-flex; align-items: center; justify-content: center;
        width: 40px; height: 40px; border-radius: 9999px; flex-shrink: 0;
        transition: background 0.15s;
      }
      .wf-iconbtn:hover { background: var(--hover); }
      .wf-search {
        margin: 0 auto; display: none; width: 100%; max-width: 560px;
        align-items: center; gap: 8px;
      }
      @media (min-width: 640px) { .wf-search { display: flex; } }
      .wf-search-box {
        position: relative; display: flex; height: 40px; flex: 1; align-items: center;
        border-radius: 9999px; border: 1px solid var(--border);
        background: color-mix(in srgb, var(--secondary) 40%, transparent);
      }
      .wf-search-box:focus-within { border-color: color-mix(in srgb, var(--foreground) 40%, transparent); }
      .wf-search-input {
        height: 100%; flex: 1; min-width: 0; border: 0; outline: none;
        background: transparent; padding-left: 16px; font-size: 14px; color: var(--foreground);
      }
      .wf-search-input::placeholder { color: var(--muted-foreground); }
      .wf-search-btn {
        height: 100%; border-radius: 0 9999px 9999px 0; padding: 0 20px;
        border-left: 1px solid var(--border); background: var(--secondary);
        display: inline-flex; align-items: center;
      }
      .wf-search-btn:hover { background: var(--accent); }
      .wf-mic {
        width: 40px; height: 40px; border-radius: 9999px; flex-shrink: 0;
        background: color-mix(in srgb, var(--secondary) 60%, transparent);
        display: inline-flex; align-items: center; justify-content: center;
      }
      .wf-mic:hover { background: var(--secondary); }
      .wf-topbar-right { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
      @media (min-width: 640px) { .wf-topbar-right { gap: 4px; } }
      .wf-suggest {
        position: absolute; top: 44px; left: 0; right: 0; z-index: 50;
        border-radius: 12px; border: 1px solid var(--border);
        background: var(--background); box-shadow: 0 8px 24px rgba(0,0,0,0.35);
        overflow: hidden; text-align: left;
      }
      .wf-suggest-item {
        display: flex; align-items: center; gap: 10px; width: 100%;
        padding: 8px 14px; font-size: 14px; text-align: left;
      }
      .wf-suggest-item:hover, .wf-suggest-item[data-active="true"] { background: var(--hover); }

      /* ---------- sidebar (w-60 = 240px / rail w-[72px]) ---------- */
      .wf-sidebar {
        display: none; flex-shrink: 0; overflow-y: auto;
        width: 240px; transition: width 0.2s;
      }
      @media (min-width: 768px) { .wf-sidebar { display: block; } }
      .wf-sidebar[data-collapsed="true"] { width: 72px; }
      .wf-nav { display: flex; flex-direction: column; gap: 2px; padding: 0 8px 16px; }
      .wf-sidebar[data-collapsed="true"] .wf-nav { align-items: center; padding: 8px 4px; }
      .wf-navrow {
        display: flex; align-items: center; gap: 24px; border-radius: 8px;
        padding: 10px 12px; font-size: 14px; font-weight: 500; line-height: 1;
        transition: background 0.15s; width: 100%; text-align: left;
      }
      .wf-sidebar[data-collapsed="true"] .wf-navrow {
        flex-direction: column; gap: 4px; padding: 14px 4px;
        font-size: 10px; line-height: 1.2; align-items: center; text-align: center;
      }
      .wf-navrow:hover { background: color-mix(in srgb, var(--accent) 60%, transparent); }
      .wf-navrow[data-active="true"] { background: var(--secondary); color: var(--foreground); font-weight: 500; }
      .wf-navrow[data-active="true"] svg { stroke-width: 2.2; }
      .wf-navrow svg { width: 22px; height: 22px; flex-shrink: 0; stroke-width: 1.8; }
      .wf-sidebar[data-collapsed="true"] .wf-navrow svg { width: 24px; height: 24px; }
      .wf-navrow .wf-truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .wf-nav-section {
        padding: 12px 12px 4px; font-size: 11px; font-weight: 600;
        text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted-foreground);
      }
      .wf-sidebar[data-collapsed="true"] .wf-nav-section, .wf-sidebar[data-collapsed="true"] .wf-nav-divider,
      .wf-sidebar[data-collapsed="true"] .wf-nav-foot, .wf-sidebar[data-collapsed="true"] .wf-nav-subrow { display: none; }
      .wf-nav-divider { margin: 8px 12px; border-top: 1px solid color-mix(in srgb, var(--border) 70%, transparent); }
      .wf-nav-subrow {
        display: flex; align-items: center; gap: 24px; border-radius: 8px;
        padding: 8px 12px; font-size: 14px; color: color-mix(in srgb, var(--foreground) 90%, transparent);
        transition: background 0.15s; width: 100%; text-align: left;
      }
      .wf-nav-subrow:hover { background: color-mix(in srgb, var(--accent) 60%, transparent); }
      .wf-nav-subrow svg { width: 22px; height: 22px; flex-shrink: 0; stroke-width: 1.8; }
      .wf-nav-subrow img, .wf-nav-avatar { width: 24px; height: 24px; border-radius: 9999px; flex-shrink: 0; }
      .wf-nav-foot {
        display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 8px 12px 0;
        font-size: 11px; color: var(--muted-foreground);
      }
      .wf-nav-copyright { padding: 8px 12px 0; font-size: 11px; color: color-mix(in srgb, var(--muted-foreground) 70%, transparent); }

      /* ---------- category chips ---------- */
      .wf-chips {
        display: flex; gap: 12px; overflow-x: auto; padding: 12px 16px;
        scrollbar-width: none;
      }
      .wf-chips::-webkit-scrollbar { display: none; }
      .wf-chip {
        flex-shrink: 0; border-radius: 9999px; padding: 6px 14px;
        font-size: 14px; font-weight: 500; line-height: 1;
        background: var(--secondary); color: color-mix(in srgb, var(--foreground) 90%, transparent);
        transition: background 0.15s;
      }
      .wf-chip:hover { background: var(--accent); }
      .wf-chip[data-active="true"] { background: var(--foreground); color: var(--background); }

      /* ---------- video grid + cards ---------- */
      .wf-grid {
        display: grid; grid-template-columns: 1fr; column-gap: 16px; row-gap: 36px;
        padding: 0 16px;
      }
      @media (min-width: 640px) { .wf-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      @media (min-width: 1024px) { .wf-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
      @media (min-width: 1300px) { .wf-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
      .wf-card { display: flex; flex-direction: column; }
      .wf-card-rail { width: 320px; flex-shrink: 0; }
      @media (min-width: 640px) { .wf-card-rail { width: 360px; } }
      .wf-thumb {
        position: relative; display: block; overflow: hidden; border-radius: 12px;
        background: var(--secondary); aspect-ratio: 16 / 9; width: 100%;
      }
      .wf-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .wf-duration {
        position: absolute; bottom: 6px; right: 6px; border-radius: 4px;
        padding: 2px 6px; font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums;
        background: var(--badge-bg); color: #fff;
      }
      .wf-livebadge {
        position: absolute; bottom: 6px; right: 6px; border-radius: 4px;
        padding: 2px 6px; font-size: 11px; font-weight: 700; text-transform: uppercase;
        background: var(--yt-red); color: #fff; display: inline-flex; align-items: center; gap: 4px;
      }
      .wf-livebadge::before { content: ""; width: 6px; height: 6px; border-radius: 9999px; background: #fff; }
      .wf-watched {
        position: absolute; bottom: 0; left: 0; right: 0;
        background: rgba(0, 0, 0, 0.8); color: #fff;
        padding: 4px 6px; font-size: 10px; font-weight: 600;
        text-transform: uppercase; letter-spacing: 0.05em;
      }
      .wf-progress { position: absolute; bottom: 0; left: 0; height: 4px; width: 100%; background: rgba(255,255,255,0.3); }
      .wf-progress-bar { height: 100%; background: var(--yt-red); }
      .wf-card-meta { display: flex; gap: 12px; margin-top: 12px; }
      .wf-avatar {
        width: 36px; height: 36px; border-radius: 9999px; flex-shrink: 0;
        display: none; align-items: center; justify-content: center;
        background: var(--secondary); font-size: 14px; font-weight: 600; overflow: hidden;
      }
      @media (min-width: 640px) { .wf-avatar { display: inline-flex; } }
      .wf-card-meta-body { flex: 1; min-width: 0; }
      .wf-card-title {
        display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
        overflow: hidden; font-size: 14px; font-weight: 500; line-height: 1.375; cursor: pointer;
      }
      .wf-card-channel {
        display: flex; align-items: center; gap: 4px; width: fit-content; margin-top: 4px;
        font-size: 13px; color: var(--muted-foreground);
      }
      .wf-card-channel:hover { color: var(--foreground); }
      .wf-card-views { font-size: 13px; color: var(--muted-foreground); }
      .wf-verified { display: inline-flex; color: var(--muted-foreground); margin-left: 2px; }

      /* ---------- shelf scroller + shorts shelf ---------- */
      .wf-shelf { margin-top: 8px; }
      .wf-shelf-title {
        display: flex; align-items: center; gap: 8px; padding: 0 16px;
        font-size: 20px; font-weight: 600;
      }
      .wf-shelf-title svg { width: 24px; height: 24px; color: var(--yt-red); stroke-width: 2.2; }
      .wf-shelf-row { display: flex; gap: 16px; overflow-x: auto; padding: 12px 16px; scrollbar-width: none; }
      .wf-shelf-row::-webkit-scrollbar { display: none; }
      .wf-shortstile {
        display: flex; flex-direction: column; gap: 8px; width: 168px; flex-shrink: 0; cursor: pointer;
      }
      @media (min-width: 640px) { .wf-shortstile { width: 192px; } }
      @media (min-width: 1024px) { .wf-shortstile { width: 234px; } }
      @media (min-width: 1280px) { .wf-shortstile { width: 264px; } }
      @media (min-width: 1536px) { .wf-shortstile { width: 296px; } }
      .wf-shortstile .wf-thumb { aspect-ratio: 9 / 16; border-radius: 12px; }
      .wf-shortstile img { transition: transform 0.2s; }
      .wf-shortstile:hover img { transform: scale(1.05); }
      .wf-shortstile-title {
        display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
        overflow: hidden; font-size: 14px; font-weight: 500; line-height: 1.375;
      }
      .wf-shortstile-views { font-size: 13px; color: var(--muted-foreground); margin-top: -4px; }

      /* ---------- continue rail ---------- */
      .wf-rail { margin-top: 8px; }
      .wf-rail-title { padding: 0 16px; font-size: 20px; font-weight: 600; }

      /* ---------- footer ---------- */
      .wf-footer {
        margin-top: auto; border-top: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
        padding: 16px 16px 16px; color: var(--muted-foreground);
      }
      @media (min-width: 640px) { .wf-footer { padding-left: 24px; padding-right: 24px; } }
      .wf-footer-brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; font-size: 14px; }
      .wf-footer-brand strong { font-weight: 500; color: color-mix(in srgb, var(--foreground) 80%, transparent); }
      .wf-footer-links { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 12px; font-size: 13px; }
      .wf-footer-links a:hover { color: var(--foreground); text-decoration: underline; text-underline-offset: 2px; }
      .wf-footer-copy { margin-top: 12px; font-size: 12px; color: color-mix(in srgb, var(--muted-foreground) 70%, transparent); }

      /* ---------- watch page ---------- */
      .wf-watch { display: flex; flex-direction: column; gap: 16px; padding: 16px; max-width: 1280px; margin: 0 auto; }
      @media (min-width: 1024px) { .wf-watch { flex-direction: row; } }
      .wf-watch-primary { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
      .wf-watch-rail { display: flex; flex-direction: column; gap: 8px; }
      @media (min-width: 1024px) { .wf-watch-rail { width: 402px; flex-shrink: 0; } }
      .wf-player { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #000; }
      .wf-player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
      .wf-watch-title { font-size: 20px; font-weight: 600; line-height: 1.3; margin: 0; }
      @media (min-width: 640px) { .wf-watch-title { font-size: 22px; } }
      .wf-watch-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
      .wf-watch-channel { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
      .wf-watch-channel .wf-avatar { display: inline-flex; width: 40px; height: 40px; }
      .wf-watch-channel-name { font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 4px; }
      .wf-watch-channel-subs { font-size: 12px; color: var(--muted-foreground); }
      .wf-btn {
        display: inline-flex; align-items: center; gap: 6px; border-radius: 9999px;
        padding: 8px 14px; font-size: 14px; font-weight: 500;
        background: var(--secondary); color: var(--foreground); transition: background 0.15s;
        white-space: nowrap;
      }
      .wf-btn:hover { background: var(--accent); }
      .wf-btn-primary { background: var(--yt-red); color: #fff; }
      .wf-btn-primary:hover { background: #cc0000; }
      .wf-btn-ghost { background: transparent; }
      .wf-btn-ghost:hover { background: var(--hover); }
      .wf-btn svg { width: 18px; height: 18px; stroke-width: 2; }
      .wf-likes { display: inline-flex; border-radius: 9999px; background: var(--secondary); overflow: hidden; }
      .wf-likes > button { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: 14px; font-weight: 500; }
      .wf-likes > button:hover { background: var(--accent); }
      .wf-likes .wf-likes-sep { width: 1px; background: color-mix(in srgb, var(--foreground) 20%, transparent); }
      .wf-desc {
        border-radius: 12px; background: var(--secondary); padding: 12px;
        font-size: 14px; line-height: 1.5;
      }
      .wf-desc-meta { font-weight: 500; }
      .wf-desc-text { margin: 8px 0 0; white-space: pre-line; overflow: hidden; }
      .wf-desc[data-expanded="false"] .wf-desc-text { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
      .wf-desc-more { margin-top: 6px; font-weight: 500; border-radius: 4px; }
      .wf-comments { display: flex; flex-direction: column; gap: 16px; }
      .wf-comments-count { font-size: 16px; font-weight: 600; }
      .wf-comment { display: flex; gap: 12px; }
      .wf-comment-body { min-width: 0; }
      .wf-comment-head { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted-foreground); }
      .wf-comment-author { font-weight: 500; color: var(--foreground); }
      .wf-comment-text { margin: 2px 0 0; font-size: 14px; }
      .wf-comment-actions { display: flex; align-items: center; gap: 12px; margin-top: 6px; font-size: 12px; color: var(--muted-foreground); }
      .wf-comment-actions button { display: inline-flex; align-items: center; gap: 4px; }
      .wf-comment-actions button:hover { color: var(--foreground); }
      .wf-comment-actions svg { width: 14px; height: 14px; }
      .wf-pin { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted-foreground); }
      .wf-related-card { display: flex; gap: 8px; cursor: pointer; }
      .wf-related-card .wf-thumb { width: 168px; flex-shrink: 0; }
      .wf-related-body { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
      .wf-related-title {
        display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
        font-size: 14px; font-weight: 500; line-height: 1.375;
      }
      .wf-related-meta { font-size: 12px; color: var(--muted-foreground); }

      /* ---------- search results ---------- */
      .wf-searchpage { display: flex; flex-direction: column; gap: 24px; padding: 16px; max-width: 1096px; margin: 0 auto; }
      .wf-result { display: flex; flex-direction: column; gap: 12px; }
      @media (min-width: 640px) { .wf-result { flex-direction: row; } }
      .wf-result .wf-thumb { width: 100%; }
      @media (min-width: 640px) { .wf-result .wf-thumb { width: 360px; flex-shrink: 0; } }
      .wf-channel-result {
        display: flex; align-items: center; gap: 16px; padding: 8px 0;
        border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
      }
      .wf-channel-result .wf-avatar { display: inline-flex; width: 88px; height: 88px; font-size: 32px; }
      .wf-filters {
        display: flex; align-items: center; gap: 8px; justify-content: center;
        border-bottom: 1px solid var(--border); padding-bottom: 12px; font-size: 14px; font-weight: 500;
      }
      .wf-filters svg { width: 18px; height: 18px; }

      /* ---------- shorts page ---------- */
      .wf-shortspage { display: flex; justify-content: center; padding: 8px; }
      .wf-shortsframe { width: 100%; max-width: 420px; }
      .wf-short-item { display: flex; gap: 12px; justify-content: center; margin-bottom: 24px; }
      .wf-short-player { position: relative; width: 100%; aspect-ratio: 9 / 16; border-radius: 16px; overflow: hidden; background: #000; }
      .wf-short-player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
      .wf-short-side { display: flex; flex-direction: column; justify-content: flex-end; gap: 16px; padding-bottom: 16px; }
      .wf-short-side .wf-iconbtn { background: var(--secondary); width: 44px; height: 44px; }
      .wf-short-side-label { font-size: 11px; color: var(--muted-foreground); text-align: center; }

      /* ---------- trending ---------- */
      .wf-trending { padding: 16px; max-width: 1096px; margin: 0 auto; }
      .wf-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
      .wf-tabs::-webkit-scrollbar { display: none; }
      .wf-trend-row { display: flex; gap: 16px; align-items: center; padding: 8px 0; border-bottom: 1px solid color-mix(in srgb, var(--border) 50%, transparent); }
      .wf-trend-rank { width: 32px; text-align: center; font-size: 16px; font-weight: 600; color: var(--muted-foreground); flex-shrink: 0; }
      .wf-trend-row .wf-thumb { width: 246px; flex-shrink: 0; }
      .wf-trend-body { min-width: 0; }

      /* ---------- channel page ---------- */
      .wf-channel { padding: 0 16px 16px; max-width: 1280px; margin: 0 auto; }
      .wf-channel-banner {
        height: 120px; border-radius: 12px; margin: 12px 0 16px;
        background: linear-gradient(120deg, #ff0000 0%, #7c0000 45%, #1a1a1a 100%);
      }
      @media (min-width: 640px) { .wf-channel-banner { height: 160px; } }
      .wf-channel-head { display: flex; gap: 16px; align-items: center; }
      .wf-channel-head .wf-avatar { display: inline-flex; width: 80px; height: 80px; font-size: 30px; }
      @media (min-width: 640px) { .wf-channel-head .wf-avatar { width: 128px; height: 128px; font-size: 48px; } }
